name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 掃有沒有不小心把金鑰推上來
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # build 得起來，EC2 上才 build 得起來
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t message-board .
